org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=false
# PocketDev's global gradle.properties caps the build daemon at 512 MiB heap
# and 256 MiB metaspace, and under Gradle 9 that file wins over this one, so
# org.gradle.jvmargs above does not apply on the phone. The same global file
# pins kotlin.compiler.execution.strategy to in-process, which loads the
# compiler into that capped daemon: a cold build runs it out of Metaspace
# (a fresh compileDebugKotlin). The default daemon strategy keeps the
# compiler in its own process and the Gradle daemon out of trouble.
kotlin.compiler.execution.strategy=daemon
